<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-label="Напиши в Telegram: t.me/Oko_Kleima"><title>Напиши в Telegram: t.me/Oko_Kleima</title><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
.spin{transform-origin:190px 190px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.play{animation:play 24s linear infinite}
@keyframes play{from{width:40px}to{width:640px}}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.5s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.glow{animation:glow 5s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.5}50%{opacity:.9}}
.blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fae"/><stop offset="1" stop-color="#c2185b"/></linearGradient><linearGradient id="pv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6fae"/><stop offset="1" stop-color="#c2185b" stop-opacity=".4"/></linearGradient></defs><rect width="1100" height="150" rx="16" fill="#08060a"/><rect x=".5" y=".5" width="1099" height="149" rx="15.5" fill="none" stroke="#2b2229"/>
<text x="44" y="56" class="m" font-size="13" fill="#ff6fae" letter-spacing="4">NEXT TRACK ▶▶</text>
<text x="44" y="100" font-size="34" font-weight="800" fill="#f6f1f4">Есть идея? Напиши.</text>
