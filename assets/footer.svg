<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="150" viewBox="0 0 1100 150" role="img" aria-label="Напиши в Telegram: t.me/Oko_Kleima"><title>Напиши в Telegram: t.me/Oko_Kleima</title><style>
