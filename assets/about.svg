<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-label="Заряжен на идеи. Пишу круто и чётко. Люблю красивый UI/UX. Создал PlayLek."><title>Заряжен на идеи. Пишу круто и чётко. Люблю красивый UI/UX. Создал PlayLek.</title><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.6s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.charge{animation:ch 4s ease-in-out infinite}
@keyframes ch{0%{width:14px}60%,100%{width:118px}}
.glow{animation:glow 4s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.45}50%{opacity:.85}}
.blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.bolt{animation:bo 4s ease-in-out infinite}@keyframes bo{0%,55%{opacity:.3}70%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fae"/><stop offset="1" stop-color="#c2185b"/></linearGradient><linearGradient id="pv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6fae"/><stop offset="1" stop-color="#c2185b" stop-opacity=".35"/></linearGradient></defs><g transform="translate(0 0)"><rect x="0" y="0" width="540" height="170" rx="16" fill="#08060a"/><rect x="0.5" y="0.5" width="539" height="169" rx="15.5" fill="none" stroke="#2b2229"/>
<rect x="28" y="28" width="56" height="56" rx="14" fill="url(#pk)"/><g transform="translate(28 28)"><path d="M14 -22L-10 6H3L-4 26L20 -4H7Z" fill="#08060a" transform="translate(28 28) scale(.95)"/></g>
<text x="104" y="62" font-size="26" font-weight="800" fill="#f6f1f4">Заряжен на идеи</text>
<text x="104" y="86" class="m" font-size="12" fill="#ff6fae" letter-spacing="3">01</text>
<text x="28" y="124" font-size="16" fill="#a79ba3">Расскажи, что хочешь собрать — разберёмся</text><text x="28" y="148" font-size="16" fill="#a79ba3">и сделаем. Быстро и без воды.</text></g><g transform="translate(560 0)"><rect x="0" y="0" width="540" height="170" rx="16" fill="#08060a"/><rect x="0.5" y="0.5" width="539" height="169" rx="15.5" fill="none" stroke="#2b2229"/>
<rect x="28" y="28" width="56" height="56" rx="14" fill="url(#pk)"/><g transform="translate(28 28)"><path d="M20 16L8 28L20 40M36 16L48 28L36 40M32 12L24 44" fill="none" stroke="#08060a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="104" y="62" font-size="26" font-weight="800" fill="#f6f1f4">Пишу круто и чётко</text>
<text x="104" y="86" class="m" font-size="12" fill="#ff6fae" letter-spacing="3">02</text>
<text x="28" y="124" font-size="16" fill="#a79ba3">Чистый код и понятная структура, ничего лишнего.</text><text x="28" y="148" font-size="16" fill="#a79ba3">Rust, Kotlin, Python.</text></g><g transform="translate(0 190)"><rect x="0" y="0" width="540" height="170" rx="16" fill="#08060a"/><rect x="0.5" y="0.5" width="539" height="169" rx="15.5" fill="none" stroke="#2b2229"/>
<rect x="28" y="28" width="56" height="56" rx="14" fill="url(#pk)"/><g transform="translate(28 28)"><rect x="8" y="10" width="40" height="36" rx="6" fill="none" stroke="#08060a" stroke-width="4"/><path d="M8 20H48" stroke="#08060a" stroke-width="4"/><rect x="15" y="27" width="12" height="12" rx="3" fill="#08060a"/><path d="M33 29H41M33 37H41" stroke="#08060a" stroke-width="3" stroke-linecap="round"/></g>
<text x="104" y="62" font-size="26" font-weight="800" fill="#f6f1f4">Люблю красивый UI/UX</text>
<text x="104" y="86" class="m" font-size="12" fill="#ff6fae" letter-spacing="3">03</text>
<text x="28" y="124" font-size="16" fill="#a79ba3">Тёмные темы, анимации, детали — интерфейс</text><text x="28" y="148" font-size="16" fill="#a79ba3">должен ощущаться, а не просто работать.</text></g><g transform="translate(560 190)"><rect x="0" y="0" width="540" height="170" rx="16" fill="#08060a"/><rect x="0.5" y="0.5" width="539" height="169" rx="15.5" fill="none" stroke="#2b2229"/>
<rect x="28" y="28" width="56" height="56" rx="14" fill="url(#pk)"/><g transform="translate(28 28)"><circle cx="28" cy="28" r="20" fill="none" stroke="#08060a" stroke-width="4"/><path d="M23 18L38 28L23 38Z" fill="#08060a"/></g>
<text x="104" y="62" font-size="26" font-weight="800" fill="#f6f1f4">Создал PlayLek</text>
<text x="104" y="86" class="m" font-size="12" fill="#ff6fae" letter-spacing="3">04</text>
<text x="28" y="124" font-size="16" fill="#a79ba3">Плеер для музыки из Telegram — на Android и</text><text x="28" y="148" font-size="16" fill="#a79ba3">Windows. Сам, от идеи до релизов.</text></g></svg>